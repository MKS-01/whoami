name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token scoped for Pages deploys.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue the next one instead of cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Nothing is generated, so there is no build — but every script ships
      # unbundled to the browser with no compile step to fail first, and a
      # syntax error would reach visitors as a silently dead page. Catch it
      # here instead. Installs nothing: the repo has no dependencies.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Parse every script
        run: bun run check

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

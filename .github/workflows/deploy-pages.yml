name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token scoped for Pages deploys.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue the next one instead of cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The blog's HTML is generated from blog/posts/*.md and committed, so
      # Pages can keep serving plain static files. That only stays true if the
      # two never diverge — this fails the deploy on a hand-edited blog page
      # or a .md whose rebuild was forgotten, rather than letting the site go
      # out of sync with its source. It writes nothing.
      - name: Verify the blog matches its markdown
        run: python3 tools/build-blog.py --check

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

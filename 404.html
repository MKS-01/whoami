<!doctype html>
<!-- GitHub Pages serves this for any path it can't find under the site.

     Its one job is a redirect, so it deliberately has NO chrome of its own.
     Posts used to live at /blog/<slug>.html, one file each. They render from
     /blogs/?p=<slug> now — different folder, different URL shape — so every
     link ever shared to a post is a miss. This catches both the old folder
     and the new one and hands the slug to the renderer.

     A third hand-kept copy of the header would be exactly the duplication
     favicon.svg and blogs/index.html exist to prevent, so anything that is
     not a legacy post URL bounces to the landing rather than drawing its own. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>mks.sh</title>
<meta name="robots" content="noindex">
<script>
  (() => {
    /* Capture the base too, rather than hardcoding /whoami/ — the site is
       served from a subpath on Pages but from the root by `bun run dev`,
       and a redirect that only works in production isn't testable. */
    const post = /^(.*)\/blogs?\/([A-Za-z0-9-]+)\.html$/.exec(location.pathname);
    if (post && post[2] !== "index") {
      location.replace(`${post[1]}/blogs/?p=${post[2]}`);
    } else {
      location.replace(location.pathname.startsWith("/whoami/") ? "/whoami/" : "/");
    }
  })();
</script>
<meta http-equiv="refresh" content="0; url=../">
</head>
<body></body>
</html>
